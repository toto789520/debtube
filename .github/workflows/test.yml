name: Run Tests

on:
  push:
    branches: [ main, vibe/** ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y mpv libmpv-dev
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-qt PyQt6 yt-dlp python-mpv pillow requests
    
    - name: Run non-GUI tests
      run: |
        # Run only non-GUI tests in CI (GUI tests require display)
        pytest tests/test_yt_client.py tests/test_helpers.py tests/test_history_manager.py tests/test_favorites_manager.py tests/test_playlist_manager.py -v --tb=short
