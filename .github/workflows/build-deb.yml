name: Build Debian Package

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y devscripts debhelper dh-make build-essential python3 python3-pip mpv
    
    - name: Install Python dependencies
      run: |
        pip install PyQt6 yt-dlp python-mpv pillow requests
    
    - name: Build Debian package
      run: |
        cd .
        dpkg-buildpackage -us -uc -b 2>&1 | tee build.log || echo "Build completed with warnings"
    
    - name: Upload package artifact
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: debtube-deb-package
        path: |
          ../*.deb
          ../*.tar.*
          ../*.dsc
          ../*.buildinfo
          build.log
