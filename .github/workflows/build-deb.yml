name: Build Debian Package

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y devscripts debhelper dh-make build-essential python3 python3-pip mpv
    
    - name: Install Python dependencies
      run: |
        pip install PyQt6 yt-dlp python-mpv pillow requests
    
    - name: Prepare debian package
      run: |
        # Ensure debian directory exists
        mkdir -p debian
        
        # Create changelog if it doesn't exist
        if [ ! -f debian/changelog ]; then
          echo "debtube (0.1.0-1) unstable; urgency=medium

  * Initial release.

 -- DebTube Team <debtube@example.com>  $(date -R)
" | sudo tee debian/changelog
        fi
        
        # Create control file if it doesn't exist
        if [ ! -f debian/control ]; then
          cat > debian/control << 'EOF'
Source: debtube
Section: sound
Priority: optional
Maintainer: DebTube Team <debtube@example.com>
Build-Depends: debhelper (>= 11)
Standards-Version: 4.6.0
Homepage: https://github.com/toto789520/debtube

Package: debtube
Architecture: all
Depends: 
    python3,
    python3-pip,
    mpv,
    ${misc:Depends}
Description: YouTube Music Player for Debian
 DebTube is a simple, lightweight YouTube music player for Debian 12+.
 It allows you to search, play, and save music from YouTube and YouTube Music.
EOF
        fi
        
        # Create rules file if it doesn't exist
        if [ ! -f debian/rules ]; then
          cat > debian/rules << 'EOF'
#!/usr/bin/make -f
%:
	dh $@

override_dh_auto_install:
	install -d debian/debtube/usr/bin
	install -d debian/debtube/usr/share/debtube
	install -d debian/debtube/usr/share/applications
	install -d debian/debtube/usr/share/pixmaps
	
	cp -r src debian/debtube/usr/share/debtube/
	cp main.py debian/debtube/usr/share/debtube/
	cp requirements.txt debian/debtube/usr/share/debtube/
	cp README.md debian/debtube/usr/share/debtube/
	cp LICENSE debian/debtube/usr/share/debtube/
	
	cat > debian/debtube/usr/bin/debtube << 'SCRIPT'
#!/bin/bash
cd /usr/share/debtube && python3 main.py
SCRIPT
	chmod +x debian/debtube/usr/bin/debtube
	
	cat > debian/debtube/usr/share/applications/debtube.desktop << 'EOF'
[Desktop Entry]
Version=1.0
Type=Application
Name=DebTube
Comment=YouTube Music Player
Exec=/usr/bin/debtube
Icon=/usr/share/pixmaps/debtube.png
Terminal=false
Categories=AudioVideo;Player;Music;
StartupWMClass=DebTube
EOF
	
	touch debian/debtube/usr/share/pixmaps/debtube.png
EOF
        fi
        
        # Create compat file if it doesn't exist
        if [ ! -f debian/compat ]; then
          echo "11" > debian/compat
        fi
        
        # Create source format file if it doesn't exist
        mkdir -p debian/source
        if [ ! -f debian/source/format ]; then
          echo "3.0 (native)" > debian/source/format
        fi
    
    - name: Build Debian package
      run: |
        cd .
        dpkg-buildpackage -us -uc -b 2>&1 | tee build.log || echo "Build completed with warnings"
    
    - name: Upload package artifact
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: debtube-deb-package
        path: |
          ../*.deb
          ../*.tar.*
          ../*.dsc
          ../*.buildinfo
          build.log
